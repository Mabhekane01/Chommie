services:
  # --- Databases ---
  postgres:
    image: postgres:15-alpine
    container_name: chommie_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chommie-net

  mongodb:
    image: mongo:6.0
    container_name: chommie_mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db
    networks:
      - chommie-net

  redis:
    image: redis:7-alpine
    container_name: chommie_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chommie-net

  # --- Microservices ---
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: chommie_api_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # Dev-only: lets scripts/seed.js hit admin routes locally. Ignored in production.
      - ADMIN_BYPASS=${ADMIN_BYPASS:-true}
      - PAYFAST_MERCHANT_ID=${PAYFAST_MERCHANT_ID}
      - PAYFAST_MERCHANT_KEY=${PAYFAST_MERCHANT_KEY}
      - PAYFAST_PASSPHRASE=${PAYFAST_PASSPHRASE}
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - PRODUCT_SERVICE_HOST=product-service
      - PRODUCT_SERVICE_PORT=3002
      - BNPL_SERVICE_HOST=bnpl-service
      - BNPL_SERVICE_PORT=3003
      - ORDER_SERVICE_HOST=order-service
      - ORDER_SERVICE_PORT=3004
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=3005
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3006
      - RECOMMENDATION_SERVICE_HOST=recommendation-service
      - RECOMMENDATION_SERVICE_PORT=3007
      - CIRCLE_SERVICE_HOST=circle-service
      - CIRCLE_SERVICE_PORT=3008
      - MEMBERSHIP_SERVICE_HOST=membership-service
      - MEMBERSHIP_SERVICE_PORT=3009
      - AD_SERVICE_HOST=ad-service
      - AD_SERVICE_PORT=3010
      - SUPPLY_SERVICE_HOST=supply-service
      - SUPPLY_SERVICE_PORT=3011
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - chommie-net

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: chommie_auth_service
    environment:
      - PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - BNPL_SERVICE_HOST=bnpl-service
      - BNPL_SERVICE_PORT=3003
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=3005
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: chommie_product_service
    environment:
      - PORT=3002
      - MONGODB_URI=${MONGODB_URI}
      - ORDER_SERVICE_HOST=order-service
      - ORDER_SERVICE_PORT=3004
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - chommie-net

  bnpl-service:
    build:
      context: .
      dockerfile: services/bnpl-service/Dockerfile
    container_name: chommie_bnpl_service
    environment:
      - PORT=3003
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: chommie_order_service
    environment:
      - PORT=3004
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=3005
      - PRODUCT_SERVICE_HOST=product-service
      - PRODUCT_SERVICE_PORT=3002
      - BNPL_SERVICE_HOST=bnpl-service
      - BNPL_SERVICE_PORT=3003
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3006
      - MEMBERSHIP_SERVICE_HOST=membership-service
      - MEMBERSHIP_SERVICE_PORT=3009
      - CIRCLE_SERVICE_HOST=circle-service
      - CIRCLE_SERVICE_PORT=3008
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: chommie_notification_service
    environment:
      - PORT=3005
    networks:
      - chommie-net

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: chommie_payment_service
    environment:
      - PORT=3006
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PAYFAST_MERCHANT_ID=${PAYFAST_MERCHANT_ID}
      - PAYFAST_MERCHANT_KEY=${PAYFAST_MERCHANT_KEY}
      - PAYFAST_PASSPHRASE=${PAYFAST_PASSPHRASE}
      - OZOW_SITE_CODE=${OZOW_SITE_CODE}
      - OZOW_PRIVATE_KEY=${OZOW_PRIVATE_KEY}
      - OZOW_API_KEY=${OZOW_API_KEY}
      - OZOW_IS_TEST=${OZOW_IS_TEST:-true}
      - YOCO_SECRET_KEY=${YOCO_SECRET_KEY}
      - YOCO_WEBHOOK_SECRET=${YOCO_WEBHOOK_SECRET}
      - PAYSHAP_PROXY=${PAYSHAP_PROXY}
      - ORDER_SERVICE_HOST=order-service
      - ORDER_SERVICE_PORT=3004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    container_name: chommie_recommendation_service
    environment:
      - PORT=3007
      - PRODUCT_SERVICE_HOST=product-service
      - PRODUCT_SERVICE_PORT=3002
      - CIRCLE_SERVICE_HOST=circle-service
      - CIRCLE_SERVICE_PORT=3008
      - MEMBERSHIP_SERVICE_HOST=membership-service
      - MEMBERSHIP_SERVICE_PORT=3009
      - AD_SERVICE_HOST=ad-service
      - AD_SERVICE_PORT=3010
    depends_on:
      - product-service
      - circle-service
      - membership-service
      - ad-service
    networks:
      - chommie-net

  circle-service:
    build:
      context: .
      dockerfile: services/circle-service/Dockerfile
    container_name: chommie_circle_service
    environment:
      - PORT=3008
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  membership-service:
    build:
      context: .
      dockerfile: services/membership-service/Dockerfile
    container_name: chommie_membership_service
    environment:
      - PORT=3009
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  ad-service:
    build:
      context: .
      dockerfile: services/ad-service/Dockerfile
    container_name: chommie_ad_service
    environment:
      - PORT=3010
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PRODUCT_SERVICE_HOST=product-service
      - PRODUCT_SERVICE_PORT=3002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  supply-service:
    build:
      context: .
      dockerfile: services/supply-service/Dockerfile
    container_name: chommie_supply_service
    environment:
      - PORT=3011
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MEMBERSHIP_SERVICE_HOST=membership-service
      - MEMBERSHIP_SERVICE_PORT=3009
      - CIRCLE_SERVICE_HOST=circle-service
      - CIRCLE_SERVICE_PORT=3008
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chommie-net

  # --- Frontend ---
  # The customer storefront (apps/web, Next.js) runs via `npm run dev` (port 4300).
  # Chommie is the retailer — there is no vendor/seller app.

networks:
  chommie-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
